server.port=${PORT:8080}

# Spring Boot MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://${MONGO_USERNAME:<username>}:${MONGO_PASSWORD:<password>}@cluster0.aoda8xk.mongodb.net/?appName=Cluster0}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:vehicledb}
spring.data.mongodb.auto-index-creation=true

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin Authorization Key
admin.secret.key=${ADMIN_SECRET_KEY:secret-admin-key}

management.endpoints.web.exposure.include=health,info,prometheus
